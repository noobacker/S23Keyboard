name: S23Keyboard
options:
  bundleIdPrefix: com.harshal
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: '0.3.0'
targets:
  S23Keyboard:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Keyboard
        excludes: [Info.plist]
      - path: Sources/ClipboardCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harshal.S23Keyboard
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: S23 Style Keyboard
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: Keyboard
  Keyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Sources/ClipboardCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harshal.S23Keyboard.Keyboard
        TARGETED_DEVICE_FAMILY: '1'
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: S23 Style
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-GB
            RequestsOpenAccess: true
schemes:
  S23Keyboard:
    build:
      targets:
        S23Keyboard: all
